services:
  - type: web
    name: ai-worker
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 8 --timeout 300
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: MASTER_ENCRYPTION_KEY
        sync: false
