<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0a0a0f">
  <title>AI Worker</title>
  <link rel="stylesheet" href="/public/style.css">
</head>
<body>
  <!-- SETUP: stays until Connect succeeds -->
  <div id="setup" class="screen setup-screen">
    <div class="setup-wrap">
      <div class="setup-glow"></div>
      <div class="setup-icon">
        <svg viewBox="0 0 64 64" width="56" height="56">
          <defs>
            <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#60a5fa"/>
              <stop offset="50%" stop-color="#a78bfa"/>
              <stop offset="100%" stop-color="#f472b6"/>
            </linearGradient>
          </defs>
          <circle cx="32" cy="32" r="28" fill="url(#g1)" opacity="0.9"/>
          <circle cx="32" cy="32" r="14" fill="#0a0a0f"/>
        </svg>
      </div>
      <h1>AI Worker</h1>
      <p class="setup-sub">GitHub Personal Access Token लगाओ। यह बॉक्स Connect होने तक यहीं रहेगा।</p>
      <label class="field-label">GitHub Token</label>
      <input type="password" id="tokenInput" placeholder="ghp_... या github_pat_..." autocomplete="off" autocapitalize="off" spellcheck="false">
      <button type="button" id="verifyBtn" class="btn-main">Connect</button>
      <p id="setupErr" class="err"></p>
      <p class="setup-hint">Token सिर्फ इस फ़ोन पर सेव होता है · Render पर <code>ELEVENLABS_API_KEY</code> डालो अच्छी आवाज़ के लिए</p>
    </div>
  </div>

  <!-- MAIN -->
  <div id="main" class="screen main-screen hidden">
    <button type="button" id="menuBtn" class="menu-btn" aria-label="menu">⋯</button>

    <div id="voicePanel" class="voice-panel hidden">
      <div class="vp-head">
        <span>ElevenLabs Voice</span>
        <button type="button" id="vpClose" class="x">✕</button>
      </div>
      <p id="voiceHint" class="vp-hint"></p>
      <div id="voiceList" class="voice-list"></div>
    </div>

    <div class="stage">
      <div id="orb" class="orb state-idle" aria-hidden="true">
        <div class="orb-outer"></div>
        <div class="orb-mid"></div>
        <div class="orb-core"></div>
        <div class="orb-shine"></div>
      </div>
      <p id="statusLine" class="status-line">सुन रहा हूँ…</p>
    </div>

    <div id="boxLayer" class="box-layer"></div>

    <div id="progress" class="progress hidden">
      <div class="prog-card">
        <div class="prog-ring"></div>
        <p id="progText">काम चल रहा है…</p>
      </div>
    </div>
  </div>

  <input type="file" id="zipPicker" accept=".zip,application/zip" class="sr-only">
  <audio id="ttsAudio" preload="auto"></audio>
  <script src="/public/app.js"></script>
</body>
</html>
