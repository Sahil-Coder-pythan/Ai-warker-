<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>AI Worker</title>
  <link rel="stylesheet" href="/public/style.css">
</head>
<body>
  <div id="setup" class="screen">
    <div class="setup-card">
      <div class="setup-orb"></div>
      <h1>AI Worker</h1>
      <p>GitHub token डालो। उसके बाद स्क्रीन साफ — बीच में गोल-गोल, हमेशा सुनता रहेगा।</p>
      <input type="password" id="tokenInput" placeholder="ghp_... या github_pat_..." autocomplete="off">
      <button id="verifyBtn" class="btn">Connect</button>
      <p id="setupErr" class="err"></p>
      <p class="hint">Token सिर्फ इस डिवाइस पर रहता है।</p>
    </div>
  </div>

  <div id="main" class="screen hidden">
    <button id="menuBtn" class="menu-btn" aria-label="menu">⋯</button>

    <div id="voicePanel" class="voice-panel hidden">
      <div class="vp-head">
        <span>Voice</span>
        <button id="vpClose" class="x">✕</button>
      </div>
      <div id="voiceList" class="voice-list"></div>
    </div>

    <div class="stage">
      <div id="orb" class="orb idle">
        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="core"></div>
      </div>
      <p id="statusLine" class="status-line">सुन रहा हूँ…</p>
    </div>

    <div id="boxLayer" class="box-layer"></div>

    <div id="progress" class="progress hidden">
      <div class="prog-card">
        <div class="prog-orb"></div>
        <p id="progText">काम चल रहा है…</p>
        <div class="bar"><i id="progBar"></i></div>
      </div>
    </div>
  </div>

  <input type="file" id="zipPicker" accept=".zip,application/zip" class="hidden-input">
  <script src="/public/app.js"></script>
</body>
</html>
